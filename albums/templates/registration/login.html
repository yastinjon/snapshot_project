{% extends 'albums/base.html' %}

{% block title %}Sign In - Snapshot{% endblock %}

{% block content %}
<div class="w-full max-w-md bg-darkCard border border-slate-800/80 rounded-2xl p-8 shadow-2xl transition-all duration-300 hover:border-slate-700/50">
    <div class="mb-8">
        <h2 class="text-2xl font-bold text-white tracking-tight">Welcome back</h2>
        <p class="text-slate-400 text-sm mt-1">Please enter your details to access your gallery.</p>
    </div>

    <form method="POST" class="space-y-5">
        {% csrf_token %}
        
        <div>
            <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Username</label>
            <input type="text" name="username" id="username" required
                class="w-full bg-darkBg border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-accentBlue focus:ring-1 focus:ring-accentBlue transition text-sm">
        </div>

        <div>
            <div class="flex justify-between items-center mb-2">
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Password</label>
                <a href="#" class="text-xs text-accentBlue hover:underline transition">Forgot password?</a>
            </div>
            <input type="password" name="password" id="password" required
                class="w-full bg-darkBg border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-accentBlue focus:ring-1 focus:ring-accentBlue transition text-sm">
        </div>

        <button type="submit" 
            class="w-full bg-accentBlue text-darkBg font-semibold text-sm py-3 rounded-xl hover:opacity-95 transform active:scale-[0.98] transition shadow-lg shadow-accentBlue/10 mt-2">
            Sign In
        </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-800 text-center">
        <p class="text-sm text-slate-400">
            Don't have an account? 
            <a href="{% url 'signup' %}" class="text-accentBlue font-medium hover:underline transition">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
