<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapshot — Photo App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-white text-black min-h-screen">

    <header class="border-b border-black">
        <div class="max-w-6xl mx-auto px-6 py-8 flex items-center justify-between">
            <a href="/" class="text-2xl font-bold tracking-tighter uppercase">
                Snapshot<span class="text-gray-400">—Photo App</span>
            </a>

            <nav class="flex items-center gap-6">
                {% if user.is_authenticated %}
                    <span class="text-xs font-bold uppercase tracking-widest text-gray-500">
                        {{ user.username }}
                    </span>
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button class="text-xs font-bold uppercase tracking-widest hover:text-gray-500 transition-colors">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="text-xs font-bold uppercase tracking-widest hover:text-gray-500 transition-colors">Login</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="max-w-6xl mx-auto px-6 py-10 border-t border-gray-200 text-gray-400 text-[10px] uppercase tracking-widest">
        &copy; 2026 Snapshot Gallery
    </footer>

</body>
</html>
