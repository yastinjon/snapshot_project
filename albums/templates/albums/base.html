<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Snapshot{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0F172A',     /* Slate 900 */
                        darkCard: '#1E293B',   /* Slate 800 */
                        accentBlue: '#38BDF8', /* Sky 400 */
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col font-sans selection:bg-accentBlue selection:text-darkBg">

    <nav class="border-b border-slate-800 bg-darkBg/80 backdrop-blur-md sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                <span class="bg-accentBlue w-3 h-3 rounded-full animate-pulse"></span>
                SNAPSHOT
            </a>
            <div class="flex items-center gap-6 text-sm font-medium text-slate-400">
                {% if user.is_authenticated %}
                    <a href="#" class="hover:text-white transition">Gallery</a>
                    <a href="#" class="hover:text-white transition">Upload</a>
                    <a href="#" class="bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 transition">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="hover:text-white transition">Sign In</a>
                    <a href="{% url 'signup' %}" class="bg-accentBlue text-darkBg px-4 py-2 rounded-lg font-semibold hover:opacity-90 transition">Get Started</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
