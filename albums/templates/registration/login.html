{% extends 'albums/base.html' %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="bg-[#111827] border border-gray-800 rounded-2xl shadow-2xl overflow-hidden">
        
        <div class="bg-[#1F2937]/50 border-b border-gray-800/80 px-8 py-8 text-center">
            <div class="w-12 h-12 bg-[#14B8A6]/10 border border-[#14B8A6]/30 rounded-xl flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6 text-[#14B8A6]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-white">Welcome Back</h2>
            <p class="text-gray-400 text-xs mt-1">Please enter your account details to access your dashboard.</p>
        </div>

        <form method="post" class="p-8 space-y-6">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="bg-rose-500/10 border border-rose-500/20 text-rose-400 px-4 py-3 rounded-xl text-xs font-medium">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <div class="space-y-5 form-custom-styles">
                {{ form.as_p }}
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full bg-[#14B8A6] hover:bg-[#0D9488] text-[#0B0F19] text-sm font-bold py-3 rounded-xl shadow-lg transition duration-150">
                    Sign In
                </button>
                <p class="text-sm text-center text-gray-400 mt-6">
                    Don't have an account? <a href="{% url 'signup' %}" class="underline text-[#14B8A6] hover:text-[#0D9488] font-medium">Create one here</a>.
                </p>
            </div>
        </form>
    </div>
</div>

<style>
    .form-custom-styles p {
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
        margin-bottom: 1.25rem;
    }
    .form-custom-styles label {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #9CA3AF;
    }
    .form-custom-styles input {
        width: 100%;
        padding: 0.75rem 1rem;
        font-size: 0.875rem;
        background-color: #0B0F19;
        border: 1px solid #1F2937;
        border-radius: 0.75rem;
        color: #F9FAFB;
        transition: all 0.2s;
    }
    .form-custom-styles input:focus {
        background-color: #111827;
        border-color: #14B8A6;
        outline: none;
    }
    .form-custom-styles input[type="checkbox"] {
        width: auto;
        display: inline-block;
        margin-right: 0.5rem;
    }
</style>
{% endblock %}
