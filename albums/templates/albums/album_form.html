{% extends 'albums/base.html' %}

{% block content %}
<div class="max-w-xl mx-auto">
    <a href="{% url 'album-list' %}" class="inline-flex items-center space-x-2 text-[10px] font-bold uppercase tracking-widest text-gray-400 hover:text-black transition mb-8">
        <span>&larr; Back to Dashboard</span>
    </a>

    <div class="border-2 border-black">
        <div class="border-b-2 border-black px-8 py-6">
            <h2 class="text-xl font-black uppercase tracking-tighter">
                {% if object %}Edit Album{% else %}New Album{% endif %}
            </h2>
        </div>

        <form method="post" enctype="multipart/form-data" class="p-8 space-y-8">
            {% csrf_token %}

            {% if form.errors %}
                <div class="border-2 border-black p-4 text-[10px] font-bold uppercase tracking-widest text-red-600 bg-red-50">
                    Error: Please check your inputs.
                </div>
            {% endif %}

            <div class="space-y-6 form-minimalist-styles">
                {{ form.as_p }}
            </div>

            <div class="pt-8 border-t-2 border-black flex items-center justify-end gap-6">
                <a href="{% url 'album-list' %}" class="text-xs font-bold uppercase tracking-widest hover:underline">
                    Cancel
                </a>
                <button type="submit" class="bg-black text-white text-xs font-bold px-8 py-4 uppercase tracking-widest hover:bg-gray-800 transition-colors">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>

<style>
    .form-minimalist-styles p {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .form-minimalist-styles label {
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #000000;
    }

    /* Increased border weight to 2px for clarity */
    .form-minimalist-styles input[type="text"], 
    .form-minimalist-styles textarea {
        width: 100%;
        padding: 1rem;
        font-size: 1rem;
        font-weight: 500;
        border: 2px solid #000000;
        border-radius: 0;
        outline: none;
    }

    /* Clear focus state */
    .form-minimalist-styles input[type="text"]:focus, 
    .form-minimalist-styles textarea:focus {
        background-color: #FAFAFA;
        box-shadow: 4px 4px 0px 0px #000000;
    }

    .form-minimalist-styles input[type="file"] {
        font-size: 0.875rem;
        padding: 0.5rem 0;
    }

    .form-minimalist-styles a {
        font-size: 10px;
        text-decoration: underline;
        color: #000000;
        font-weight: 700;
    }
</style>
{% endblock %}
