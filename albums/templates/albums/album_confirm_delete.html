{% extends 'albums/base.html' %}

{% block content %}
<div class="max-w-xl mx-auto my-12">
    <a href="{% url 'album-list' %}" class="inline-flex items-center space-x-2 text-xs text-white hover:text-yellow-400 font-black uppercase tracking-widest transition mb-8 group">
        <svg class="w-4 h-4 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        <span>Back to Dashboard</span>
    </a>

    <div class="bg-black border-4 border-white overflow-hidden">
        <div class="bg-red-600 px-8 py-6 border-b-4 border-white">
            <h2 class="text-3xl font-black tracking-tighter text-white uppercase flex items-center gap-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
                Delete?
            </h2>
        </div>

        <div class="p-8 space-y-8">
            <p class="text-white text-sm font-bold leading-relaxed">
                Are you absolutely sure you want to delete <strong class="text-yellow-400">"{{ object.title }}"</strong>? This action is permanent and will wipe the record and assets from the server.
            </p>

            <form method="post" class="flex flex-col sm:flex-row gap-4">
                {% csrf_token %}
                <button type="submit" class="flex-1 bg-red-600 border-4 border-white text-white text-xs font-black px-6 py-4 hover:bg-white hover:text-red-600 transition uppercase">
                    Yes, Permanently Delete
                </button>
                <a href="{% url 'album-list' %}" class="flex-1 text-center border-4 border-white text-white text-xs font-black px-6 py-4 hover:bg-white hover:text-black transition uppercase">
                    No, Keep It
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
