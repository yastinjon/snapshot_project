<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapshot — Photo App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#070A12] text-slate-200 min-h-screen flex flex-col md:flex-row">

    <aside class="md:w-64 bg-[#0D121F] border-b md:border-b-0 md:border-r border-slate-900 flex flex-col justify-between p-6 flex-shrink-0 z-40">
        <div class="space-y-8">
            <a href="/" class="flex items-center space-x-3 p-1">
                <div class="w-9 h-9 bg-gradient-to-tr from-[#0EA5E9] to-[#14B8A6] rounded-lg flex items-center justify-center">
                    <svg class="w-4 h-4 text-[#070A12]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                    </svg>
                </div>
                <div class="flex flex-col">
                    <span class="text-sm font-bold text-white tracking-wider uppercase">Snapshot</span>
                </div>
            </a>

            <div class="hidden md:block">
                {% if user.is_authenticated %}
                    <div class="bg-[#12192C] border border-slate-800 rounded-xl p-4">
                        <p class="text-[10px] text-slate-400 uppercase font-bold">Account</p>
                        <p class="text-sm font-semibold text-slate-100 truncate">{{ user.username }}</p>
                    </div>
                {% endif %}
            </div>
        </div>

        <div class="mt-8 md:mt-0 pt-6 border-t border-slate-900">
            {% if user.is_authenticated %}
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="w-full text-left text-xs text-slate-500 hover:text-rose-400 py-2">
                        Sign Out
                    </button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="text-xs text-[#14B8A6]">Login Access</a>
            {% endif %}
        </div>
    </aside>

    <main class="flex-grow flex flex-col min-h-0 overflow-y-auto">
        <header class="h-14 border-b border-slate-900 px-6 flex items-center justify-between bg-[#0D121F]/50">
            <span class="text-[10px] font-mono text-slate-600">PRODUCTION_ENV</span>
            <div class="flex items-center space-x-4">
                {% if user.is_authenticated %}
                    <span class="text-xs text-slate-400">Welcome, {{ user.username }}</span>
                {% endif %}
            </div>
        </header>

        <div class="p-6 md:p-12 w-full max-w-5xl mx-auto">
            {% block content %}
            {% endblock %}
        </div>
    </main>

</body>
</html>
